# File-based PR labels for work outside the app itself. Names, colors and descriptions live in
# labels.yml. Type, status, priority and effort labels are assigned separately.
build:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.gradle.kts'
          - gradle/**
          - gradlew
          - gradlew.bat
          - gradle.properties
          - app/src/**/AndroidManifest.xml
          - app/proguard-rules.pro

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - docs/**
          - pending-changelog/README.md

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/scripts/**
          - .github/dependabot.yml
          - .github/labeler.yml
          - .github/labels.yml

maintenance:
  - changed-files:
      - any-glob-to-any-file:
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md
