# Workflow actions are pinned to commits, not tags: tags can be moved, and the release job hands
# actions the upload key and Play credentials. Dependabot keeps the pins current by opening pull
# requests with the release notes, to be reviewed before merging.
#
# Libraries and Gradle plugins in gradle/libs.versions.toml are updated the same way. CI tests every
# pull request; dependabot-checksums.yml adds the checksums a new version needs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # A dependency goes into the first group it matches.
    groups:
      # The BOM and its libraries are released and tested together. Material 3 is pinned to a 1.5
      # alpha for the grouped Expressive menus; this offers newer alphas, and 1.5.0 once it is out,
      # which is when to move to stable.
      compose:
        patterns: ["androidx.compose*"]
      # The Kotlin compiler and its compose and serialization plugins share one version.
      kotlin:
        patterns: ["org.jetbrains.kotlin:*", "org.jetbrains.kotlin.*"]
      # The Android Gradle plugin and the test plugin, which must match.
      android-gradle-plugin:
        patterns: ["com.android*"]
      androidx:
        patterns: ["androidx.*"]
      # All other minor and patch updates in one weekly pull request; major versions come
      # separately, since they need reading.
      libraries:
        patterns: ["*"]
        update-types: [minor, patch]
