# Releases Chatter from the Actions tab. The version comes from the entries in pending-changelog/,
# as with "./gradlew releaseVersion".
#
# preflight checks the setup in seconds without building: secrets, keystore, branch, something to
# release. verify is the CI gate: changelog, unit tests, scripts, lint. release folds the changelog,
# builds and signs APK and bundle, and only then pushes the release commit and tag and publishes, so
# a failed build leaves the repository untouched.
#
# preflight and verify run in parallel without the signing key; it only reaches the step that signs.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything, but push nothing and publish nothing'
        type: boolean
        default: false
      play_track:
        description: 'Play track to upload the bundle to'
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]

# Two releases at once would race for the version and tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release commit goes to the branch the run started on; a tag on a side branch would be a
      # version master never had. Dry runs may start anywhere.
      - name: Require the default branch
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A release starts from $DEFAULT_BRANCH, not from $GITHUB_REF. Start a dry run to try another branch."
            exit 1
          fi

      # Reports all missing secrets at once.
      - name: Require the secrets
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PLAY_TRACK: ${{ inputs.play_track }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          # A published APK that cannot log in is worse than no release.
          [ -n "$TWITCH_CLIENT_ID" ] || missing+=(TWITCH_CLIENT_ID)
          # Play refuses the debug key, and the first upload's key is the only one allowed to update
          # the app. Only a dry run may sign with the debug key.
          if [ "$DRY_RUN" != "true" ] || [ -n "$KEYSTORE_BASE64" ]; then
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          fi
          if [ "$PLAY_TRACK" != "none" ]; then
            [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::The $name secret is not set."
            done
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. This dry run signs with the debug key."
          fi

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Opening the keystore here turns a wrong password or alias into a clear failure instead of
      # one deep in a signing task later. The passwords reach keytool through the environment, not
      # the command line.
      - name: Check the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || exit 0
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          # Secrets pasted from Windows or wrapped at 76 columns contain line breaks base64 -d
          # rejects.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 upload.jks"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not open with KEYSTORE_PASSWORD, or it holds no key called '$KEY_ALIAS'."
            exit 1
          fi
          # Listing the alias only proves the store password; reading the private key proves
          # KEY_PASSWORD too.
          if ! keytool -certreq -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -keypass:env KEY_PASSWORD > /dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the key '$KEY_ALIAS'."
            exit 1
          fi
          echo "The keystore opens and holds '$KEY_ALIAS'."

      - name: Require something to release
        run: |
          pending=$(find pending-changelog -type f ! -name 'README.md' ! -name '.gitkeep' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "::error::pending-changelog/ is empty, so there is no version to release."
            exit 1
          fi
          echo "Releasing $pending pending entr$([ "$pending" -eq 1 ] && echo y || echo ies)."

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar is a binary nobody reviews; this compares it with Gradle's published
      # checksums.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Check the pending changelog entries
        run: ./gradlew checkChangelog

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Check the sponsor scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Upload the test and lint reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    name: Release
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history, to push the release commit and tag and to read the previous tag's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # The signed build starts without any cache another run could have written.
        with:
          cache-disabled: true
          cache-provider: basic

      - name: Fold the pending entries into the changelog
        run: ./gradlew releaseVersion

      - name: Read the released version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          code=$(sed -n 's/^versionCode=//p' version.properties)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged. version.properties and the tags disagree."
            exit 1
          fi
          # Play refuses a versionCode it has seen, and the tags record what was released; anything
          # but an increase is a mistake.
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous" ]; then
            was=$(git show "$previous:version.properties" 2>/dev/null | sed -n 's/^versionCode=//p')
            if [ -n "$was" ] && [ "$code" -le "$was" ]; then
              echo "::error::versionCode $code is not above $was, which $previous released."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Preflight already opened it; this only puts it where Gradle reads it.
      - name: Unpack the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      # The only step with the signing key. build.gradle.kts reads it as CHATTER_*;
      # CHATTER_REQUIRE_UPLOAD_KEY makes a real release fail instead of falling back to the debug
      # key.
      #
      # Two invocations, because only the sideloaded APK may carry the GitHub Sponsors link (see
      # SPONSOR_LINK in build.gradle.kts). The bundle is built second without the flag.
      - name: Build and sign the APK and the Play bundle
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CHATTER_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CHATTER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHATTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHATTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CHATTER_REQUIRE_UPLOAD_KEY: ${{ !inputs.dry_run && '1' || '' }}
        run: |
          ./gradlew :app:assembleRelease -Pdistribution=github
          ./gradlew :app:bundleRelease

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Named after the version, with a checksum next to the APK.
      - name: Name the artifacts after the version
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="chatter-$VERSION.apk"
          aab="chatter-$VERSION.aab"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          mv app/build/outputs/bundle/release/app-release.aab "$aab"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "apk=$apk"
            echo "aab=$aab"
            echo "sha=$apk.sha256"
          } >> "$GITHUB_OUTPUT"

      # The entries this release folded in: from the newest heading to the previous one.
      - name: Write the release notes
        run: awk '/^## /{ heading++ } heading == 1 && !/^## /' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      # What was built. Not who signed it: the certificate's owner is the maintainer's name and
      # town, and run summaries are public.
      - name: Summarise the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.artifacts.outputs.apk }}
          AAB: ${{ steps.artifacts.outputs.aab }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          {
            echo "## Chatter $VERSION"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| versionCode | $CODE |"
            echo "| Dry run | $DRY_RUN |"
            echo "| Play track | $PLAY_TRACK |"
            echo "| APK | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Bundle | \`$(sha256sum "$AAB" | cut -d' ' -f1)\` |"
            echo
            echo '### Release notes'
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifacts to the run
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatter-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.sha }}
            ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error

      # Atomic, so the branch never gets the release commit without its tag or vice versa.
      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A version.properties CHANGELOG.md pending-changelog
          git commit -m "Release $VERSION"
          git tag -a "v$VERSION" -m "Chatter $VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.artifacts.outputs.apk }}
          SHA: ${{ steps.artifacts.outputs.sha }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Chatter $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$APK" "$SHA"

      # Play shows these under "What's new" and cuts after 500 characters, so entries are trimmed to
      # whole lines that fit.
      - name: Write the Play release notes
        if: ${{ inputs.play_track != 'none' }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          sed 's/^- [a-z]*: /• /' "$RUNNER_TEMP/notes.md" | grep -v '^$' | awk '
            { if (length(out) + length($0) + 1 > 500) exit; out = out $0 "\n"; print }
          ' > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cp "$RUNNER_TEMP/whatsnew/whatsnew-en-US" "$RUNNER_TEMP/whatsnew/whatsnew-de-DE"

      # The only third-party action handed a credential (the Play service account). Pinned to a
      # reviewed commit; review new versions before merging Dependabot's pull request.
      - name: Upload the bundle to Play
        if: ${{ !inputs.dry_run && inputs.play_track != 'none' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.chatter.app
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Say what a dry run would have done
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo
            echo "**Dry run:** nothing was pushed or published. A real run would have released v$VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
