# Releasing Chatter, start to finish, from the button on the Actions tab. The version is never
# typed in: the entries in pending-changelog/ decide it, exactly as "./gradlew releaseVersion" does
# on a dev machine.
#
# Three jobs, in the order a release can go wrong:
#
#   preflight  everything about the setup: the secrets, the keystore, the branch, that there is
#              something to release. Seconds, not minutes, and nothing is built.
#   verify     the same gate CI is: changelog entries, unit tests, the sponsor scripts, lint.
#   release    folds the changelog, builds and signs the APK and the Play bundle, and only then
#              pushes the release commit and tag and publishes. A build that fails leaves the
#              repository untouched.
#
# The first two run side by side and hold no signing key between them: the key is only ever in
# the one step that signs, so no test or lint run can trip over it or leak it.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything, but push nothing and publish nothing'
        type: boolean
        default: false
      play_track:
        description: 'Play track to upload the bundle to'
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]

# Two releases at once would race over the version and the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The release commit is pushed to the branch the run started on, and a tag on a side branch
      # would be a version the main line never had. A dry run may start anywhere.
      - name: Require the default branch
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A release starts from $DEFAULT_BRANCH, not from $GITHUB_REF. Start a dry run to try another branch."
            exit 1
          fi

      # Every missing secret at once, rather than one per attempt.
      - name: Require the secrets
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PLAY_TRACK: ${{ inputs.play_track }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          # A published APK that cannot log in is worse than no release at all.
          [ -n "$TWITCH_CLIENT_ID" ] || missing+=(TWITCH_CLIENT_ID)
          # Play refuses the debug key, and the key the first upload arrives with is the only one
          # that may ever update the app. A dry run may sign with the debug key; nothing else may.
          if [ "$DRY_RUN" != "true" ] || [ -n "$KEYSTORE_BASE64" ]; then
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          fi
          if [ "$PLAY_TRACK" != "none" ]; then
            [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::The $name secret is not set."
            done
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. This dry run signs with the debug key."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Opening the keystore here turns "wrong password" and "no such alias" into a failure that
      # says so, instead of one buried in a signing task ten minutes later. The passwords reach
      # keytool through the environment, never on its command line.
      - name: Check the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || exit 0
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          # A secret pasted from Windows or wrapped at 76 columns carries line breaks base64 -d
          # would stumble over.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 upload.jks"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not open with KEYSTORE_PASSWORD, or it holds no key called '$KEY_ALIAS'."
            exit 1
          fi
          # Listing the alias only proves the store password. Reading the private key proves
          # KEY_PASSWORD as well.
          if ! keytool -certreq -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -keypass:env KEY_PASSWORD > /dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the key '$KEY_ALIAS'."
            exit 1
          fi
          echo "The keystore opens and holds '$KEY_ALIAS'."

      - name: Require something to release
        run: |
          pending=$(find pending-changelog -type f ! -name 'README.md' ! -name '.gitkeep' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "::error::pending-changelog/ is empty, so there is no version to release."
            exit 1
          fi
          echo "Releasing $pending pending entr$([ "$pending" -eq 1 ] && echo y || echo ies)."

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the pending changelog entries
        run: ./gradlew checkChangelog

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Check the sponsor scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Upload the test and lint reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    name: Release
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history, so the release commit and the tag can be pushed, and so the version
      # before this one can be read back out of the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fold the pending entries into the changelog
        run: ./gradlew releaseVersion

      - name: Read the released version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          code=$(sed -n 's/^versionCode=//p' version.properties)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged. version.properties and the tags disagree."
            exit 1
          fi
          # Play refuses a bundle whose versionCode it has seen before, and the tags are the only
          # record of what went out. Anything but a step up from the last one is a mistake.
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous" ]; then
            was=$(git show "$previous:version.properties" 2>/dev/null | sed -n 's/^versionCode=//p')
            if [ -n "$was" ] && [ "$code" -le "$was" ]; then
              echo "::error::versionCode $code is not above $was, which $previous released."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Preflight has already opened it; this only puts it where Gradle can read it.
      - name: Unpack the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      # The only step that sees the signing key. build.gradle.kts reads it as CHATTER_*, and
      # CHATTER_REQUIRE_UPLOAD_KEY makes a real release stop rather than fall back to the debug key.
      #
      # Two invocations, because the two builds are not the same app: only the APK people install
      # themselves carries the link to GitHub Sponsors (see SPONSOR_LINK in build.gradle.kts), and
      # the bundle Play is handed must not. The bundle is built second and without the flag, so
      # what goes to Play is what a plain build produces.
      - name: Build and sign the APK and the Play bundle
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CHATTER_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CHATTER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHATTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHATTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CHATTER_REQUIRE_UPLOAD_KEY: ${{ !inputs.dry_run && '1' || '' }}
        run: |
          ./gradlew :app:assembleRelease -Pdistribution=github
          ./gradlew :app:bundleRelease

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Named after the version, so a downloaded APK still says which one it is, with a checksum
      # next to it for anyone who wants to be sure the download is the one that was built.
      - name: Name the artifacts after the version
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="chatter-$VERSION.apk"
          aab="chatter-$VERSION.aab"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          mv app/build/outputs/bundle/release/app-release.aab "$aab"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "apk=$apk"
            echo "aab=$aab"
            echo "sha=$apk.sha256"
          } >> "$GITHUB_OUTPUT"

      # The entries this release just folded in: everything from the newest heading down to the one
      # before it, which is what CHANGELOG.md's shape guarantees.
      - name: Write the release notes
        run: awk '/^## /{ heading++ } heading == 1 && !/^## /' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      # Which key actually signed it. Play ties the app to the first certificate it sees, so this
      # fingerprint is worth reading once and comparing with the one the Play Console shows.
      - name: Summarise the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.artifacts.outputs.apk }}
          AAB: ${{ steps.artifacts.outputs.aab }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          {
            echo "## Chatter $VERSION"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| versionCode | $CODE |"
            echo "| Dry run | $DRY_RUN |"
            echo "| Play track | $PLAY_TRACK |"
            echo "| APK | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Bundle | \`$(sha256sum "$AAB" | cut -d' ' -f1)\` |"
            echo
            echo '### Signed by'
            echo '```'
            keytool -printcert -jarfile "$AAB" | grep -E 'Owner|SHA256' || true
            echo '```'
            echo
            echo '### Release notes'
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifacts to the run
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chatter-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.sha }}
            ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error

      # Atomic, so the branch never gets the release commit without its tag or the other way round.
      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A version.properties CHANGELOG.md pending-changelog
          git commit -m "Release $VERSION"
          git tag -a "v$VERSION" -m "Chatter $VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.artifacts.outputs.apk }}
          SHA: ${{ steps.artifacts.outputs.sha }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Chatter $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$APK" "$SHA"

      # Play shows these under "What's new" and cuts anything past 500 characters, so the changelog
      # entries are trimmed to whole lines that fit.
      - name: Write the Play release notes
        if: ${{ inputs.play_track != 'none' }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          sed 's/^- [a-z]*: /• /' "$RUNNER_TEMP/notes.md" | grep -v '^$' | awk '
            { if (length(out) + length($0) + 1 > 500) exit; out = out $0 "\n"; print }
          ' > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cp "$RUNNER_TEMP/whatsnew/whatsnew-en-US" "$RUNNER_TEMP/whatsnew/whatsnew-de-DE"

      - name: Upload the bundle to Play
        if: ${{ !inputs.dry_run && inputs.play_track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.chatter.app
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Say what a dry run would have done
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo
            echo "**Dry run:** nothing was pushed or published. A real run would have released v$VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
