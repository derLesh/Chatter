# Releasing Chatter, start to finish, from the button on the Actions tab. The version is never
# typed in: the entries in pending-changelog/ decide it, exactly as "./gradlew releaseVersion" does
# on a dev machine. The workflow folds them into CHANGELOG.md, builds and signs the APK and the
# Play bundle, and only then pushes the release commit and tag — a build that fails leaves the
# repository untouched.
#
# Everything that can be wrong about a release is checked before anything is built: the Client ID,
# the keystore and its password, the alias inside it, that there is something to release, and that
# the version has not been released already. A release that gets as far as signing is one that
# Play will accept.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything, but push nothing and publish nothing'
        type: boolean
        default: false
      play_track:
        description: 'Play track to upload the bundle to'
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]

# Two releases at once would race over the version and the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The whole history, so the release commit and the tag can be pushed, and so the version
      # before this one can be read back out of the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A published APK that cannot log in is worse than no release at all, so this comes first.
      - name: Require a Twitch Client ID
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ]; then
            echo "::error::The TWITCH_CLIENT_ID secret is not set, so the APK could not log in to Twitch."
            exit 1
          fi

      - name: Require a Play service account for the chosen track
        if: ${{ inputs.play_track != 'none' }}
        run: |
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "::error::Track '${{ inputs.play_track }}' was picked, but the PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi

      - name: Require something to release
        run: |
          pending=$(find pending-changelog -type f ! -name 'README.md' ! -name '.gitkeep' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "::error::pending-changelog/ is empty, so there is no version to release."
            exit 1
          fi
          echo "Releasing $pending pending entr$([ "$pending" -eq 1 ] && echo y || echo ies)."

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Play refuses a bundle signed with the debug key, and the key the first upload arrives with
      # is the only one that may ever update the app. So the keystore is not optional any more: a
      # dry run may go without, a real release may not.
      - name: Unpack and check the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::warning::No KEYSTORE_BASE64 secret. This dry run signs with the debug key."
              exit 0
            fi
            echo "::error::No KEYSTORE_BASE64 secret, so the release could only be signed with the debug key."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD, KEY_ALIAS or KEY_PASSWORD is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Opening it here turns "wrong password" and "no such alias" into a failure that says so,
          # instead of one buried in a signing task half an hour later.
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore did not open with KEYSTORE_PASSWORD, or it holds no key called '$KEY_ALIAS'."
            exit 1
          fi
          echo "CHATTER_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "CHATTER_REQUIRE_UPLOAD_KEY=1" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Fold the pending entries into the changelog
        run: ./gradlew releaseVersion

      - name: Read the released version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          code=$(sed -n 's/^versionCode=//p' version.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged. version.properties and the tags disagree."
            exit 1
          fi
          # Play refuses a bundle whose versionCode it has seen before, and the tags are the only
          # record of what went out. Anything but a step up from the last one is a mistake.
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous" ]; then
            was=$(git show "$previous:version.properties" 2>/dev/null | sed -n 's/^versionCode=//p')
            if [ -n "$was" ] && [ "$code" -le "$was" ]; then
              echo "::error::versionCode $code is not above $was, which $previous released."
              exit 1
            fi
          fi
          echo "Chatter $version (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

      # Two invocations, because the two builds are not the same app: only the APK people install
      # themselves carries the link to GitHub Sponsors (see SPONSOR_LINK in build.gradle.kts), and
      # the bundle Play is handed must not. The bundle is built second and without the flag, so
      # what goes to Play is what a plain build produces.
      - name: Build the sideload APK
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CHATTER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHATTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHATTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pdistribution=github

      - name: Build the Play bundle
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CHATTER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHATTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHATTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      # Named after the version, so a downloaded APK still says which one it is.
      - name: Name the artifacts after the version
        id: artifacts
        run: |
          version="${{ steps.version.outputs.version }}"
          apk="chatter-$version.apk"
          aab="chatter-$version.aab"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          mv app/build/outputs/bundle/release/app-release.aab "$aab"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      # Which key actually signed it. Play ties the app to the first certificate it sees, so this
      # fingerprint is worth reading once and comparing with the one the Play Console shows.
      - name: Show what signed the release
        run: |
          {
            echo '### Signed by'
            echo '```'
            keytool -printcert -jarfile "${{ steps.artifacts.outputs.aab }}" | grep -E 'Owner|SHA256' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The entries this release just folded in: everything from the newest heading down to the one
      # before it, which is what CHANGELOG.md's shape guarantees.
      - name: Write the release notes
        run: awk '/^## /{ heading++ } heading == 1 && !/^## /' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Upload the artifacts to the run
        if: always() && steps.artifacts.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chatter-release
          path: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error

      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A version.properties CHANGELOG.md pending-changelog
          git commit -m "Release $VERSION"
          git tag -a "v$VERSION" -m "Chatter $VERSION"
          git push origin HEAD:${{ github.ref_name }} "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "Chatter $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${{ steps.artifacts.outputs.apk }}"

      # Play shows these under "What's new" and cuts anything past 500 characters, so the changelog
      # entries are trimmed to whole lines that fit.
      - name: Write the Play release notes
        if: ${{ inputs.play_track != 'none' }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          sed 's/^- [a-z]*: /• /' "$RUNNER_TEMP/notes.md" | grep -v '^$' | awk '
            { if (length(out) + length($0) + 1 > 500) exit; out = out $0 "\n"; print }
          ' > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cp "$RUNNER_TEMP/whatsnew/whatsnew-en-US" "$RUNNER_TEMP/whatsnew/whatsnew-de-DE"

      - name: Upload the bundle to Play
        if: ${{ !inputs.dry_run && inputs.play_track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.chatter.app
          releaseFiles: ${{ steps.artifacts.outputs.aab }}
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Say what a dry run would have done
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Dry run: nothing was pushed or published." >> "$GITHUB_STEP_SUMMARY"
          echo "A real run would have released v$VERSION with these notes:" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
