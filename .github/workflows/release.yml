# Releases Chatter from the Actions tab. The version comes from the entries in pending-changelog/,
# as with "./gradlew releaseVersion".
#
# preflight checks the setup in seconds without building: secrets, keystore, branch, a green CI
# run, something to release. build folds the changelog and builds APK and bundle without any key.
# sign signs them, with no Gradle in reach of the key. publish only then pushes the release commit
# and tag and publishes, so a failed build or signing leaves the repository untouched. play uploads
# the bundle last, as a job of its own, so a refused upload is retried without releasing twice.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything, but push nothing and publish nothing'
        type: boolean
        default: false
      play_track:
        description: 'Play track to upload the bundle to'
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]

# Two releases at once would race for the version and tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The signing secrets live only in this environment, which only master may use. A dry run from
    # another branch gets no environment and signs with a throwaway key.
    environment: ${{ github.ref_name == github.event.repository.default_branch && 'release' || '' }}
    # actions: read for the CI runs of the commit.
    permissions:
      contents: read
      actions: read
    steps:
      # Full history, to find the newest commit CI built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release commit goes to the branch the run started on; a tag on a side branch would be a
      # version master never had. Dry runs may start anywhere.
      - name: Require the default branch
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A release starts from $DEFAULT_BRANCH, not from $GITHUB_REF. Start a dry run to try another branch."
            exit 1
          fi

      # The release does not test again; it builds what CI passed. CI skips the build for commits
      # that only touch Markdown or docs/, and never runs for the last release commit, pushed with
      # the workflow token; so the check falls on the newest commit that touches more. --first-parent
      # keeps a merge from being traced to its pull request's commit, which has no push run.
      - name: Require a green CI run
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          commit=$(git log -1 --first-parent --format=%H HEAD -- . ':(exclude,glob)**/*.md' ':(exclude)docs' \
            ':(exclude)version.properties' ':(exclude)pending-changelog')
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" \
            --limit 1 --json status,conclusion,url --jq '.[0] // empty | "\(.status)|\(.conclusion)|\(.url)"')
          # "|" keeps the empty conclusion of a run that is still going.
          IFS='|' read -r status conclusion url <<< "$run"
          if [ "$conclusion" = success ]; then
            echo "CI passed for ${commit:0:7}: $url"
            exit 0
          fi
          if [ -z "$run" ]; then
            message="CI has not run for ${commit:0:7}."
          else
            message="CI for ${commit:0:7} is ${conclusion:-$status}: $url"
          fi
          # A dry run publishes nothing, so a branch commit without a CI run of its own may still try.
          if [ "$DRY_RUN" = true ]; then
            echo "::warning::$message"
          else
            echo "::error::$message"
            exit 1
          fi

      # Reports all missing secrets at once.
      - name: Require the secrets
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PLAY_TRACK: ${{ inputs.play_track }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          # A published APK that cannot log in is worse than no release.
          [ -n "$TWITCH_CLIENT_ID" ] || missing+=(TWITCH_CLIENT_ID)
          # Play refuses the debug key, and the first upload's key is the only one allowed to update
          # the app. Only a dry run may sign with a throwaway key.
          if [ "$DRY_RUN" != "true" ] || [ -n "$KEYSTORE_BASE64" ]; then
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          fi
          if [ "$PLAY_TRACK" != "none" ]; then
            [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || missing+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::The $name secret is not set."
            done
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. This dry run signs with a throwaway key."
          fi

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Opening the keystore here turns a wrong password or alias into a clear failure instead of
      # one deep in a signing task later. The passwords reach keytool through the environment, not
      # the command line.
      - name: Check the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || exit 0
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          # Secrets pasted from Windows or wrapped at 76 columns contain line breaks base64 -d
          # rejects.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 upload.jks"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore does not open with KEYSTORE_PASSWORD, or it holds no key called '$KEY_ALIAS'."
            exit 1
          fi
          # Listing the alias only proves the store password; reading the private key proves
          # KEY_PASSWORD too.
          if ! keytool -certreq -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -keypass:env KEY_PASSWORD > /dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the key '$KEY_ALIAS'."
            exit 1
          fi
          echo "The keystore opens and holds '$KEY_ALIAS'."

      - name: Require something to release
        run: |
          pending=$(find pending-changelog -type f ! -name 'README.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "::error::pending-changelog/ is empty, so there is no version to release."
            exit 1
          fi
          echo "Releasing $pending pending entr$([ "$pending" -eq 1 ] && echo y || echo ies)."

  # Builds without any key: the APK, the Play bundle, their mappings, the notes and the release
  # commit, handed to the next jobs as an artifact.
  build:
    name: Build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history, to read the previous tag's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # The release build starts without any cache another run could have written.
        with:
          cache-disabled: true
          cache-provider: basic

      - name: Fold the pending entries into the changelog
        run: ./gradlew releaseVersion

      - name: Read the released version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          code=$(sed -n 's/^versionCode=//p' version.properties)
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged. version.properties and the tags disagree."
            exit 1
          fi
          # Play refuses a versionCode it has seen, and the tags record what was released; anything
          # but an increase is a mistake.
          # Only release tags; the nightly workflow keeps a tag of its own.
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$previous" ]; then
            was=$(git show "$previous:version.properties" 2>/dev/null | sed -n 's/^versionCode=//p')
            if [ -n "$was" ] && [ "$code" -le "$was" ]; then
              echo "::error::versionCode $code is not above $was, which $previous released."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # Two invocations, because only the sideloaded APK may carry the GitHub Sponsors link (see
      # SPONSOR_LINK in build.gradle.kts). The bundle is built second without the flag.
      - name: Build the APK and the Play bundle
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          # Optional: without it, Imgur only offers itself once the user enters a key of their own.
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
        run: |
          ./gradlew :app:assembleRelease -Pdistribution=github -Punsigned
          # The bundle's R8 run writes a mapping of its own over this one.
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/apk-mapping.txt"
          ./gradlew :app:bundleRelease -Punsigned

      # The mappings turn the stack trace of a crash in that build back into readable names.
      - name: Collect the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir build-out
          mv app/build/outputs/apk/release/app-release-unsigned.apk build-out/unsigned.apk
          mv app/build/outputs/bundle/release/app-release.aab build-out/unsigned.aab
          mv "$RUNNER_TEMP/apk-mapping.txt" "build-out/chatter-$VERSION-mapping.txt"
          mv app/build/outputs/mapping/release/mapping.txt "build-out/chatter-$VERSION-bundle-mapping.txt"

      # notes.md holds the entries this release folded in, as CHANGELOG.md has them, for Play.
      # github-notes.md groups them by level for the GitHub release and links the full diff.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
        run: |
          awk '/^## /{ heading++ } heading == 1 && !/^## /' CHANGELOG.md > build-out/notes.md
          section() {
            entries=$(sed -n "s/^- $1: /- /p" build-out/notes.md)
            if [ -n "$entries" ]; then printf '### %s\n\n%s\n\n' "$2" "$entries"; fi
          }
          {
            section major 'Changed'
            section minor 'New'
            section patch 'Fixed and improved'
            if [ -n "$PREVIOUS" ]; then
              echo "**Full changelog:** https://github.com/$REPOSITORY/compare/$PREVIOUS...v$VERSION"
            fi
          } > build-out/github-notes.md

      # Made here, from exactly the changelog and version this build used; publish applies it.
      - name: Write the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A version.properties CHANGELOG.md pending-changelog
          git commit -q -m "chore(release): $VERSION"
          git format-patch -1 --stdout > build-out/release.patch

      - name: Summarise the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLAY_TRACK: ${{ inputs.play_track }}
        run: |
          {
            echo "## Chatter $VERSION"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| versionCode | $CODE |"
            echo "| Dry run | $DRY_RUN |"
            echo "| Play track | $PLAY_TRACK |"
            echo
            echo '### Release notes, as the GitHub release will show them'
            echo
            cat build-out/github-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the build to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build-out/
          retention-days: 7
          if-no-files-found: error

  # The only job with the signing key, and it runs no Gradle: apksigner and jarsigner from the
  # runner's Android SDK sign what build made.
  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # As in preflight.
    environment: ${{ github.ref_name == github.event.repository.default_branch && 'release' || '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build-out

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The keystore exists only inside this step. A dry run without one signs with a throwaway key,
      # so it takes the same path as a release; preflight already refused a real run without it.
      - name: Sign the APK and the Play bundle
        id: signed
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          elif [ "$DRY_RUN" = true ]; then
            export KEY_ALIAS=dry-run KEYSTORE_PASSWORD=dry-run-only KEY_PASSWORD=dry-run-only
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Chatter dry run' \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD
            echo "::warning::No KEYSTORE_BASE64 secret. This dry run signs with a throwaway key."
          else
            echo "::error::A release needs the KEYSTORE_BASE64 secret."
            exit 1
          fi
          apk="chatter-$VERSION.apk"
          aab="chatter-$VERSION.aab"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -P 16 -f 4 build-out/unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$aab" build-out/unsigned.aab "$KEY_ALIAS" > /dev/null
          certificate=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
          # Exits 0 for an unsigned file too; -strict would fail on what every Android key is: self-signed.
          jarsigner -verify "$aab" | grep -q 'jar verified'
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "apk=$apk"
            echo "aab=$aab"
            echo "sha=$apk.sha256"
            echo "certificate=$certificate"
          } >> "$GITHUB_OUTPUT"

      - name: Summarise the signing
        env:
          APK: ${{ steps.signed.outputs.apk }}
          AAB: ${{ steps.signed.outputs.aab }}
          CERTIFICATE: ${{ steps.signed.outputs.certificate }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo '| | |'
            echo '| --- | --- |'
            echo "| APK | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Bundle | \`$(sha256sum "$AAB" | cut -d' ' -f1)\` |"
            echo "| Certificate | \`$CERTIFICATE\` |"
            if [ "$DRY_RUN" = true ]; then
              echo
              echo "**Dry run:** nothing is pushed or published. A real run would release v$VERSION."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the signed files to the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatter-${{ needs.build.outputs.version }}
          path: |
            ${{ steps.signed.outputs.apk }}
            ${{ steps.signed.outputs.sha }}
            ${{ steps.signed.outputs.aab }}
          if-no-files-found: error

  # Attests, pushes the release commit and tag, and publishes. No signing key here.
  publish:
    name: Publish
    needs: [build, sign]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token and attestations only for the attestation step; no other job may sign one.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The commit the build started from; the release commit goes on top of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build-out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatter-${{ needs.build.outputs.version }}

      # Signed by GitHub: this workflow, this commit and this run built these files. The checksum
      # next to the APK only proves the download is whole, since the same job uploads both.
      - name: Attest the APK and the bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            chatter-${{ needs.build.outputs.version }}.apk
            chatter-${{ needs.build.outputs.version }}.aab

      # Atomic, so the branch never gets the release commit without its tag or vice versa.
      - name: Push the release commit and tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am -q build-out/release.patch
          git tag -a "v$VERSION" -m "Chatter $VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Chatter $VERSION" \
            --notes-file build-out/github-notes.md \
            "chatter-$VERSION.apk" "chatter-$VERSION.apk.sha256" "build-out/chatter-$VERSION-mapping.txt"

  # After publish, so Play never gets a version without its tag. Re-running this job alone retries
  # the upload with the same signed bundle.
  play:
    name: Upload to Play
    needs: [build, publish]
    if: ${{ !inputs.dry_run && inputs.play_track != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build-out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatter-${{ needs.build.outputs.version }}

      # Play shows these under "What's new" and cuts after 500 characters, so entries are trimmed to
      # whole lines that fit.
      - name: Write the Play release notes
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          sed 's/^- [a-z]*: /• /' build-out/notes.md | grep -v '^$' | awk '
            { if (length(out) + length($0) + 1 > 500) exit; out = out $0 "\n"; print }
          ' > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cp "$RUNNER_TEMP/whatsnew/whatsnew-en-US" "$RUNNER_TEMP/whatsnew/whatsnew-de-DE"

      # The only third-party action handed a credential (the Play service account). Pinned to a
      # reviewed commit; review new versions before merging Dependabot's pull request.
      - name: Upload the bundle to Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.lesh.chatter
          releaseFiles: chatter-${{ needs.build.outputs.version }}.aab
          mappingFile: build-out/chatter-${{ needs.build.outputs.version }}-bundle-mapping.txt
          track: ${{ inputs.play_track }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
