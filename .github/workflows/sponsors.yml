# Syncs docs/supporters.json with GitHub Sponsors. GitHub has no trigger for new sponsorships, so it
# polls, every few hours once the schedule is enabled.
#
# It writes everything except the Twitch account, which GitHub does not know; a badge on the wrong
# name is worse than none. New entries get an empty "twitch", the app skips them, and the run
# summary lists them.
name: Sponsors

# Off until SPONSORS_TOKEN exists; only runs when started by hand. Re-enable the schedule then.
on:
  # schedule:
  #   - cron: "23 */6 * * *"
  workflow_dispatch:

# Only the supporter list is written, only by this job.
permissions:
  contents: write

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  sync:
    name: Bring the supporter list up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the rules the list is folded together by
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Ask GitHub Sponsors
        env:
          # A classic token of the sponsored account with read:user, to read its sponsorships.
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: python3 .github/scripts/sync-sponsors.py --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push it, if it changed
        run: |
          if [ -z "$(git status --porcelain docs/supporters.json)" ]; then
            echo "The list was already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporters.json
          git commit -m "Bring the supporter list up to date"
          git push
