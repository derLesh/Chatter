# Dependabot updates fail CI because gradle/verification-metadata.xml lacks the new checksums. This
# adds them to the pull request and restarts CI, so the update is judged by the build.
#
# Two jobs: the first runs the build (and whatever a new plugin version does) with a read-only
# token. The second can write but only runs git: it takes the file from the first job, rejects it if
# an existing checksum changed, and pushes it.
name: Dependabot checksums

on:
  pull_request:
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties

concurrency:
  group: dependabot-checksums-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  write:
    name: Record the new checksums
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No cache: files downloaded by another run are exactly what must not be trusted here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The command from AGENTS.md. An update that breaks the build still gets its checksums, so CI
      # fails on the breakage and not on the file.
      - name: Write the checksums
        continue-on-error: true
        run: ./gradlew --continue --write-verification-metadata sha256 build :app:bundleRelease :app:assembleMicrobenchmarkAndroidTest :baselineprofile:assemble

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  push:
    name: Add them to the pull request
    needs: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To restart CI: pushes with this token trigger no workflows.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-metadata
          path: gradle/

      # Gradle keeps existing checksums and adds new ones, so an update only adds lines. A removed
      # or changed line means a checksum changed for an unchanged version; a person has to look at
      # that.
      - name: Check that checksums were only added
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "Nothing new to record."
            exit 0
          fi
          removed=$(git diff --numstat -- gradle/verification-metadata.xml | cut -f2)
          if [ "$removed" != "0" ]; then
            echo "::error::An existing checksum changed. Read the diff before trusting it:"
            git diff -- gradle/verification-metadata.xml
            exit 1
          fi
          git diff --stat -- gradle/verification-metadata.xml

      - name: Push and start CI again
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- gradle/verification-metadata.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the checksums of the updated dependencies" -- gradle/verification-metadata.xml
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
