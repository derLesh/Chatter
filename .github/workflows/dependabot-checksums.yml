# Dependabot updates fail CI because gradle/verification-metadata.xml lacks the new checksums. This
# adds them to the pull request and restarts CI, so the update is judged by the build.
#
# Two jobs: the first runs the build (and whatever a new plugin version does) with a read-only
# token. The second can write but runs no build: it reads the file from the first job, refuses it
# unless the only change is checksums for new artifacts, and pushes it.
name: Dependabot checksums

on:
  pull_request:
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties

concurrency:
  group: dependabot-checksums-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  write:
    name: Record the new checksums
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No cache: files downloaded by another run are exactly what must not be trusted here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The command from AGENTS.md. An update that breaks the build still gets its checksums, so CI
      # fails on the breakage and not on the file.
      - name: Write the checksums
        continue-on-error: true
        run: ./gradlew --continue --write-verification-metadata sha256 build :app:bundleRelease :app:assembleMicrobenchmarkAndroidTest :baselineprofile:assemble

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  push:
    name: Add them to the pull request
    needs: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To restart CI: pushes with this token trigger no workflows.
      actions: write
    steps:
      # The check comes from master, not from the branch it judges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: trusted
          sparse-checkout: .github/scripts/check-verification-metadata.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Without credentials: the token only reaches the step that pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          path: branch
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/regenerated

      # The file is trust policy too, so an update that removes no line can still loosen it. Only
      # checksums for artifacts that were not there before go through; a person reads the rest.
      - name: Check that only new checksums were added
        run: |
          python3 -I trusted/.github/scripts/check-verification-metadata.py \
            branch/gradle/verification-metadata.xml "$RUNNER_TEMP/regenerated/verification-metadata.xml"
          cp "$RUNNER_TEMP/regenerated/verification-metadata.xml" branch/gradle/verification-metadata.xml

      - name: Push and start CI again
        working-directory: branch
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- gradle/verification-metadata.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the checksums of the updated dependencies" -- gradle/verification-metadata.xml
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
