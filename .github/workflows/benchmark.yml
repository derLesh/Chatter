# Measures what one incoming message costs, for a branch and for master. Chatter stays joined in the
# background, so this is what the battery pays all night; regressions should show before merge.
#
# Started by hand on the branch to measure: an emulator run takes over ten minutes. Both checkouts
# run on the same emulator one after the other, since numbers from different machines are not
# comparable.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      compare_with:
        description: The branch or tag to compare with
        default: master
        required: true

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Measure a message
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: branch
          persist-credentials: false

      # Nothing to compare when the branch is the comparison branch.
      - name: Check out ${{ inputs.compare_with }}
        if: github.ref_name != inputs.compare_with
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.compare_with }}
          path: base
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The emulator needs hardware acceleration, which the runner only grants once enabled.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The action runs each script line separately, so each run is one line.
      - name: Run the benchmark on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            sh branch/.github/scripts/run-benchmark.sh branch "$PWD/branch.json"
            if [ -d base ]; then sh branch/.github/scripts/run-benchmark.sh base "$PWD/base.json"; fi

      - name: Write the summary
        run: |
          if [ -f base.json ]; then
            python3 branch/.github/scripts/benchmark-summary.py branch.json base.json >> "$GITHUB_STEP_SUMMARY"
          else
            python3 branch/.github/scripts/benchmark-summary.py branch.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the raw numbers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: |
            branch.json
            base.json
          if-no-files-found: ignore
          retention-days: 30
