# Builds Chatter Nightly from master every night and puts the APK into the one GitHub release
# tagged "nightly", replacing the one before. Nightly is an app of its own (me.lesh.chatter.nightly),
# so it installs next to Chatter; it is only on GitHub, never on Play.
#
# check decides whether there is anything to build: a commit the last nightly did not have, and
# that CI passed. build builds exactly that commit without any key; publish signs it, with no
# Gradle in reach of the key, and replaces the release.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  # Builds even when master has not moved, to replace a broken nightly.
  workflow_dispatch:

# Two runs at once would race for the release.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for the CI runs of the commit.
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      build: ${{ steps.commit.outputs.build }}
    steps:
      # A nightly from a side branch would claim commits master never had.
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Nightly builds $DEFAULT_BRANCH, not $GITHUB_REF."
            exit 1
          fi

      # Full history and tags, to find the commit the last nightly was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the commit to build
        id: commit
        run: |
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          echo "commit=$head" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$head" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "The nightly already holds $head; nothing new to build." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The nightly does not run the tests again; it relies on CI having passed. The release commit
      # is pushed with the workflow token, which starts no CI, and only touches Markdown,
      # version.properties and pending-changelog/, so the check falls on the newest other commit.
      - name: Require a green CI run
        if: ${{ steps.commit.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git log -1 --format=%H HEAD -- . ':(exclude,glob)**/*.md' ':(exclude)docs' \
            ':(exclude)version.properties' ':(exclude)pending-changelog')
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$commit" --event push \
            --limit 1 --json status,conclusion,url --jq '.[0] // empty | "\(.status)|\(.conclusion)|\(.url)"')
          # "|" keeps the empty conclusion of a run that is still going.
          IFS='|' read -r status conclusion url <<< "$run"
          if [ "$conclusion" != success ]; then
            if [ -z "$run" ]; then
              echo "::error::CI has not run for $commit."
            else
              echo "::error::CI for $commit is ${conclusion:-$status}: $url"
            fi
            exit 1
          fi
          echo "CI passed for ${commit:0:7}: $url"

  # Builds without any key and hands the APK, its mapping and the notes to publish.
  build:
    name: Build
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      # The commit check looked at, even if master moved since. Full history for the versionCode and
      # the notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar is a binary nobody reviews; this compares it with Gradle's published
      # checksums.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # The nightly build starts without any cache another run could have written.
        with:
          cache-disabled: true
          cache-provider: basic

      # The versionCode is the number of commits, which only grows on master; the hash goes into
      # the version name.
      - name: Read the version
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          short=$(git rev-parse --short=7 HEAD)
          release=$(sed -n 's/^version=//p' version.properties)
          {
            echo "code=$code"
            echo "short=$short"
            echo "name=$release-nightly+$short"
          } >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          SHORT: ${{ steps.version.outputs.short }}
          CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease -Pdistribution=github -Pnightly="$SHORT" -PnightlyVersionCode="$CODE" -Punsigned

      # The mapping turns the stack trace of a crash in this build back into readable names.
      - name: Collect the build
        run: |
          mkdir build-out
          mv app/build/outputs/apk/release/app-release-unsigned.apk build-out/unsigned.apk
          mv app/build/outputs/mapping/release/mapping.txt build-out/chatter-nightly-mapping.txt

      # What is new since the last nightly; for the first one, since the last release.
      - name: Write the release notes
        env:
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          since=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Chatter Nightly $NAME, built from [\`$(git rev-parse --short=7 HEAD)\`](https://github.com/$REPOSITORY/commit/$(git rev-parse HEAD))."
            echo
            echo 'Nightly is built from master every night and may break. It is an app of its own, so it'
            echo 'installs next to Chatter, with its own login and settings.'
            echo
            echo '### New since the last nightly'
            echo
            if [ -n "$since" ] && [ "$since" != "$(git rev-parse HEAD)" ]; then
              git log --no-merges --format='- %s' "$since..HEAD"
            else
              echo 'Nothing; this nightly was built again from the same commit.'
            fi
            echo
            echo '### Checking the download'
            echo
            echo '```sh'
            echo "gh attestation verify chatter-nightly.apk --repo $REPOSITORY"
            echo '```'
          } > build-out/notes.md

      - name: Hand the build to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build-out/
          retention-days: 7
          if-no-files-found: error

  # Signs with the Nightly key, which lives only in this environment, and runs no Gradle. Then it
  # attests and replaces the release.
  publish:
    name: Sign and publish
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 10
    # contents: write to replace the release and its tag; id-token and attestations only for the
    # attestation step.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Reports all missing secrets at once. No fallback to another key: switching keys later would
      # make everybody uninstall Nightly to update it.
      - name: Require the secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::The $name secret is not set."
            done
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build-out

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The keystore exists only inside this step. Always the same file name, so the download link
      # never changes.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -P 16 -f 4 build-out/unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out chatter-nightly.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify chatter-nightly.apk
          sha256sum chatter-nightly.apk > chatter-nightly.apk.sha256

      - name: Attest the APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: chatter-nightly.apk

      # Deleting and creating again, so GitHub shows tonight's date and the tag moves to this
      # commit. A pre-release is never "latest", which the update check in Chatter relies on.
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --cleanup-tag --yes
          fi
          gh release create nightly \
            --target "$COMMIT" \
            --prerelease \
            --latest=false \
            --title 'Chatter Nightly' \
            --notes-file build-out/notes.md \
            chatter-nightly.apk chatter-nightly.apk.sha256 build-out/chatter-nightly-mapping.txt

      - name: Summarise the build
        env:
          NAME: ${{ needs.build.outputs.name }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          {
            echo "## Chatter Nightly $NAME"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| versionCode | $CODE |"
            echo "| APK | \`$(sha256sum chatter-nightly.apk | cut -d' ' -f1)\` |"
            echo
            cat build-out/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
