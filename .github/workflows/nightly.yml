# Builds Chatter Nightly from master every night and puts the APK into the one GitHub release
# tagged "nightly", replacing the one before. Nightly is an app of its own (me.lesh.chatter.nightly),
# so it installs next to Chatter; it is only on GitHub, never on Play.
#
# check picks what to build: the newest commit on master that CI passed for and the last nightly
# did not have. build builds exactly that commit without any key; publish signs it, with no
# Gradle in reach of the key, and replaces the release.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  # Builds even when master has not moved, to replace a broken nightly.
  workflow_dispatch:

# Two runs at once would race for the release.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    # Waiting for a CI run that is still going takes up to about 15 minutes.
    timeout-minutes: 30
    # actions: read for the CI runs of the commit.
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      build: ${{ steps.commit.outputs.build }}
    steps:
      # A nightly from a side branch would claim commits master never had.
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Nightly builds $DEFAULT_BRANCH, not $GITHUB_REF."
            exit 1
          fi

      # Full history and tags, to find the commit the last nightly was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The nightly does not run the tests again; it relies on CI having passed. It walks master back
      # from its newest commit and builds the first one CI passed for, so one red or missing run only
      # delays what goes in. A commit that only touches Markdown, docs/, version.properties or
      # pending-changelog/ counts with the newest other commit: the release commit starts no CI, and
      # a docs push gets a green run without any tests. --first-parent keeps a merge from being
      # traced to its pull request's commit, which CI ran for the pull request only.
      - name: Find the newest commit CI passed for
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          # Sets result to the conclusion of the commit's CI run, or "none" without one.
          ci_result() {
            local run id status
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$1" --event push \
              --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty | "\(.databaseId)|\(.status)|\(.conclusion)"')
            IFS='|' read -r id status result <<< "$run"
            # A push from just before the nightly is worth waiting for rather than skipping.
            if [ -n "$id" ] && [ "$status" != completed ]; then
              gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null
              result=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
            fi
            result=${result:-none}
          }
          chosen=
          checked=
          for commit in $(git rev-list --first-parent --max-count=200 HEAD); do
            if [ "$commit" = "$last" ]; then
              # Started by hand, the nightly is built again from the commit it already holds.
              [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && chosen=$commit
              break
            fi
            code=$(git log -1 --first-parent --format=%H "$commit" -- . ':(exclude,glob)**/*.md' ':(exclude)docs' \
              ':(exclude)version.properties' ':(exclude)pending-changelog')
            if [ "$code" != "$checked" ]; then
              checked=$code
              ci_result "$code"
              echo "CI for ${code:0:7}: $result"
            fi
            if [ "$result" = success ]; then
              chosen=$commit
              break
            fi
          done
          head=$(git rev-parse HEAD)
          if [ -z "$chosen" ]; then
            if [ "$last" = "$head" ]; then
              echo "The nightly already holds ${head:0:7}; nothing new to build." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::CI passed for no commit since the last nightly; it stays as it is."
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$chosen" != "$head" ]; then
            echo "::warning::CI did not pass for ${head:0:7}; building ${chosen:0:7}, the newest commit it passed for."
          fi
          echo "Building ${chosen:0:7}." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "commit=$chosen"
            echo "build=true"
          } >> "$GITHUB_OUTPUT"

  # Builds without any key and hands the APK, its mapping and the notes to publish.
  build:
    name: Build
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      # The commit check looked at, even if master moved since. Full history for the versionCode and
      # the notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar is a binary nobody reviews; this compares it with Gradle's published
      # checksums.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        # The nightly build starts without any cache another run could have written.
        with:
          cache-disabled: true
          cache-provider: basic

      # The versionCode is the number of commits, which only grows on master; the hash goes into
      # the version name.
      - name: Read the version
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          short=$(git rev-parse --short=7 HEAD)
          release=$(sed -n 's/^version=//p' version.properties)
          {
            echo "code=$code"
            echo "short=$short"
            echo "name=$release-nightly+$short"
          } >> "$GITHUB_OUTPUT"

      - name: Build the APK
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          SHORT: ${{ steps.version.outputs.short }}
          CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease -Pdistribution=github -Pnightly="$SHORT" -PnightlyVersionCode="$CODE" -Punsigned

      # The mapping turns the stack trace of a crash in this build back into readable names.
      - name: Collect the build
        run: |
          mkdir build-out
          mv app/build/outputs/apk/release/app-release-unsigned.apk build-out/unsigned.apk
          mv app/build/outputs/mapping/release/mapping.txt build-out/chatter-nightly-mapping.txt

      # What is new since the last nightly; for the first one, since the last release. Below it,
      # folded, everything since the last release, for whoever skipped a few nightlies.
      - name: Write the release notes
        env:
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          release=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          since=${last:-$release}
          {
            echo "Chatter Nightly $NAME, built from [\`$(git rev-parse --short=7 HEAD)\`](https://github.com/$REPOSITORY/commit/$(git rev-parse HEAD))."
            echo
            echo '### New since the last nightly'
            echo
            if [ -n "$since" ] && [ "$(git rev-parse "$since^{commit}")" != "$(git rev-parse HEAD)" ]; then
              git log --no-merges --format='- %s' "$since..HEAD"
            else
              echo 'Nothing; this nightly was built again from the same commit.'
            fi
            # Only when it says more than the list above: the last nightly came after the release.
            if [ -n "$last" ] && [ -n "$release" ] && [ "$last" != "$(git rev-parse "$release^{commit}")" ] &&
               git merge-base --is-ancestor "$release" "$last"; then
              echo
              echo '<details>'
              echo "<summary><b>New since Chatter ${release#v}</b></summary>"
              echo
              git log --no-merges --format='- %s' "$release..HEAD"
              echo
              echo '</details>'
            fi
          } > build-out/notes.md

      - name: Hand the build to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: build-out/
          retention-days: 7
          if-no-files-found: error

  # Signs with the Nightly key, which lives only in this environment, and runs no Gradle. Then it
  # attests and replaces the release.
  publish:
    name: Sign and publish
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 10
    # contents: write to replace the release and its tag; id-token and attestations only for the
    # attestation step.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Reports all missing secrets at once. No fallback to another key: switching keys later would
      # make everybody uninstall Nightly to update it.
      - name: Require the secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::The $name secret is not set."
            done
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build-out

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # The keystore exists only inside this step. Always the same file name, so the download link
      # never changes.
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -P 16 -f 4 build-out/unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out chatter-nightly.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify chatter-nightly.apk
          sha256sum chatter-nightly.apk > chatter-nightly.apk.sha256

      - name: Attest the APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: chatter-nightly.apk

      # Deleting and creating again, so GitHub shows tonight's date and the tag moves to this
      # commit. A pre-release is never "latest", which the update check in Chatter relies on.
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --cleanup-tag --yes
          fi
          gh release create nightly \
            --target "$COMMIT" \
            --prerelease \
            --latest=false \
            --title 'Chatter Nightly' \
            --notes-file build-out/notes.md \
            chatter-nightly.apk chatter-nightly.apk.sha256 build-out/chatter-nightly-mapping.txt

      - name: Summarise the build
        env:
          NAME: ${{ needs.build.outputs.name }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          {
            echo "## Chatter Nightly $NAME"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| versionCode | $CODE |"
            echo "| APK | \`$(sha256sum chatter-nightly.apk | cut -d' ' -f1)\` |"
            echo
            cat build-out/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
