# Builds Chatter Nightly from master every night and puts the APK into the one GitHub release
# tagged "nightly", replacing the one before. Nightly is an app of its own (dev.chatter.app.nightly),
# so it installs next to Chatter; it is only on GitHub, never on Play.
#
# check decides whether there is anything to build: a commit the last nightly did not have, and
# that CI passed. nightly builds and signs exactly that commit.
name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  # Builds even when master has not moved, to replace a broken nightly.
  workflow_dispatch:

# Two runs at once would race for the release.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for the CI runs of the commit.
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      build: ${{ steps.commit.outputs.build }}
    steps:
      # A nightly from a side branch would claim commits master never had.
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Nightly builds $DEFAULT_BRANCH, not $GITHUB_REF."
            exit 1
          fi

      # Reports all missing secrets at once. No fallback to the debug key: switching keys later
      # would make everybody uninstall Nightly to update it.
      - name: Require the secrets
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in TWITCH_CLIENT_ID KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::The $name secret is not set."
            done
            exit 1
          fi

      # Full history and tags, to find the commit the last nightly was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the commit to build
        id: commit
        run: |
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          echo "commit=$head" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$head" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "The nightly already holds $head; nothing new to build." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The nightly does not run the tests again; it relies on CI having passed for this commit.
      - name: Require a green CI run
        if: ${{ steps.commit.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT" --event push \
            --limit 1 --json status,conclusion,url --jq '.[0] // empty | "\(.status)|\(.conclusion)|\(.url)"')
          # "|" keeps the empty conclusion of a run that is still going.
          IFS='|' read -r status conclusion url <<< "$run"
          if [ "$conclusion" != success ]; then
            if [ -z "$run" ]; then
              echo "::error::CI has not run for $COMMIT."
            else
              echo "::error::CI for $COMMIT is ${conclusion:-$status}: $url"
            fi
            exit 1
          fi

  nightly:
    name: Nightly
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # contents: write to replace the release and its tag; id-token and attestations only for the
    # attestation step.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The commit check looked at, even if master moved since. Full history for the versionCode and
      # the notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar is a binary nobody reviews; this compares it with Gradle's published
      # checksums.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # The signed build starts without any cache another run could have written.
        with:
          cache-disabled: true
          cache-provider: basic

      # The versionCode is the number of commits, which only grows on master; the hash goes into
      # the version name.
      - name: Read the version
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          short=$(git rev-parse --short=7 HEAD)
          release=$(sed -n 's/^version=//p' version.properties)
          {
            echo "code=$code"
            echo "short=$short"
            echo "name=$release-nightly+$short"
          } >> "$GITHUB_OUTPUT"

      - name: Unpack the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      # The only step with the signing key. CHATTER_REQUIRE_UPLOAD_KEY makes the build fail instead
      # of falling back to the debug key.
      - name: Build and sign the APK
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CHATTER_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          CHATTER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHATTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CHATTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CHATTER_REQUIRE_UPLOAD_KEY: '1'
          SHORT: ${{ steps.version.outputs.short }}
          CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleRelease -Pdistribution=github -Pnightly="$SHORT" -PnightlyVersionCode="$CODE"

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Always the same name, so the download link never changes.
      - name: Name the APK
        id: artifacts
        run: |
          apk=chatter-nightly.apk
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          {
            echo "apk=$apk"
            echo "sha=$apk.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.apk }}

      # What is new since the last nightly; for the first one, since the last release.
      - name: Write the release notes
        env:
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ steps.version.outputs.name }}
          APK: ${{ steps.artifacts.outputs.apk }}
        run: |
          since=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Chatter Nightly $NAME, built from [\`$(git rev-parse --short=7 HEAD)\`](https://github.com/$REPOSITORY/commit/$(git rev-parse HEAD))."
            echo
            echo 'Nightly is built from master every night and may break. It is an app of its own, so it'
            echo 'installs next to Chatter, with its own login and settings.'
            echo
            echo '### New since the last nightly'
            echo
            if [ -n "$since" ] && [ "$since" != "$(git rev-parse HEAD)" ]; then
              git log --no-merges --format='- %s' "$since..HEAD"
            else
              echo 'Nothing; this nightly was built again from the same commit.'
            fi
            echo
            echo '### Checking the download'
            echo
            echo '```sh'
            echo "gh attestation verify $APK --repo $REPOSITORY"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      # Deleting and creating again, so GitHub shows tonight's date and the tag moves to this
      # commit. A pre-release is never "latest", which the update check in Chatter relies on.
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.check.outputs.commit }}
          APK: ${{ steps.artifacts.outputs.apk }}
          SHA: ${{ steps.artifacts.outputs.sha }}
        run: |
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --cleanup-tag --yes
          fi
          gh release create nightly \
            --target "$COMMIT" \
            --prerelease \
            --latest=false \
            --title 'Chatter Nightly' \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$APK" "$SHA"

      - name: Summarise the build
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.artifacts.outputs.apk }}
        run: |
          {
            echo "## Chatter Nightly $NAME"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| versionCode | $CODE |"
            echo "| APK | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
