# Every push and every pull request builds Chatter the way a release would, minus the signing: if
# this is green, the branch compiles, its tests pass, lint is happy and the changelog entries it
# adds are well formed — which is what the release workflow relies on.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the run before it pointless, so it is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the pending changelog entries
        run: ./gradlew checkChangelog

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      # No Twitch Client ID here: CI only proves the app builds, and the login is not exercised.
      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chatter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The reports say what failed, which the log alone often does not.
      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
