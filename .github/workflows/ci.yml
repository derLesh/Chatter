# Builds every push and pull request like a release, minus signing: compile, tests, lint and
# changelog entries. The release workflow relies on this being green.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar is a binary nobody reviews; this compares it with Gradle's published
      # checksums.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        # v6 caches through a closed-source library by default; the open provider over actions/cache
        # is enough.
        with:
          cache-provider: basic

      - name: Check the pending changelog entries
        run: ./gradlew checkChangelog

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The scripts other workflows run unattended: the supporter list rules and the benchmark
      # summary.
      - name: Check the workflow scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # The release variant, since that is what ships; it also checks the minified build's
      # configuration.
      - name: Lint
        run: ./gradlew :app:lintRelease

      # No Twitch Client ID: CI only proves the app builds.
      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      # R8, the resource shrinker and bundling only run in release builds; a release is a bad time
      # to find out they fail. Signed with the debug key here.
      - name: Assemble the release bundle
        run: ./gradlew :app:bundleRelease

      # Only a spare copy; the gate is build, tests and lint. A full artifact store (an account-wide
      # quota) must not fail the branch.
      - name: Upload the debug APK
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # The reports often say more than the log.
      - name: Upload the test and lint reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
