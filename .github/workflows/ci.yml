# Builds every push and pull request like a release, minus signing. The release workflow and Nightly
# rely on this being green.
#
# Two stages. checks needs no Gradle and fails in seconds: the wrapper, the commit messages, the
# workflow scripts. Only then do tests and release build start, side by side, each with a single
# Gradle call so its tasks share one configuration and run in parallel.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    # A pull request is checked from its base, a push from where master stood before it.
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gradle-wrapper.jar is a binary nobody reviews; this compares it with Gradle's published
      # checksums before any job runs it.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The convention in AGENTS.md. Merges and the reverts git writes are left alone. Without a
      # known base (a manual run) only the newest commit is checked.
      - name: Check the commit messages and their changelog entries
        run: |
          types='feat|fix|perf|ref|docs|test|build|ci|chore|revert'
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..$HEAD"; else range="-1 $HEAD"; fi
          failed=0
          for commit in $(git rev-list --no-merges $range); do
            subject=$(git log -1 --format=%s "$commit")
            case "$subject" in 'Revert "'*) continue ;; esac
            if ! grep -qE "^($types)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$" <<< "$subject" || [ ${#subject} -gt 100 ]; then
              echo "::error::${commit:0:7} \"$subject\" is not \"type(scope): what changed\", at most 100 characters and no trailing dot."
              failed=1
            elif grep -qE '^(feat|fix|perf)[(!:]' <<< "$subject" &&
                 ! git diff-tree --no-commit-id -r --name-only --diff-filter=AMR "$commit" \
                   | grep '^pending-changelog/' | grep -qv '/README\.md$'; then
              echo "::error::${commit:0:7} \"$subject\" changes what users get, so it needs its entry in pending-changelog/."
              failed=1
            fi
          done
          exit $failed

      # The script another workflow runs unattended: the check on Dependabot's checksums.
      - name: Check the workflow scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # Only Markdown and docs/ changed: the build stage is skipped, and the run still counts as
      # green for Nightly.
      - name: Decide whether to build
        id: changes
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && ! git diff --name-only "$BASE...$HEAD" | grep -qvE '(\.md$|^docs/)'; then
            echo "Only docs changed; nothing to build." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Unit tests
    needs: checks
    if: ${{ needs.checks.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Caching is done below: setup-gradle's basic cache has no restore keys, so every change to a
      # build file started empty, and both jobs raced for one key, so lint's and R8's never got in.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Dependencies and the wrapper, one entry per job. A changed build file starts from the last
      # entry and only downloads what is new.
      - name: Restore the Gradle home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-home-${{ github.job }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-home-${{ github.job }}-

      # The build cache changes with every commit, the Gradle home rarely, so each has its own entry.
      # A run starts from the newest one, a pull request from master's.
      - name: Restore the build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.job }}-${{ github.sha }}
          restore-keys: gradle-build-cache-${{ github.job }}-

      - name: Changelog entries and unit tests
        run: ./gradlew checkChangelog :app:testDebugUnitTest --continue

      - name: Upload the test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          retention-days: 7
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release-build:
    name: Lint and release build
    needs: checks
    if: ${{ needs.checks.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # As in the tests job.
      - name: Restore the Gradle home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-home-${{ github.job }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-home-${{ github.job }}-

      - name: Restore the build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.job }}-${{ github.sha }}
          restore-keys: gradle-build-cache-${{ github.job }}-

      # Lint on the release variant, since that is what ships. R8, the resource shrinker and
      # bundling only run in release builds, and a release is a bad time to find out they fail.
      # Signed with the debug key, and without a Twitch Client ID: this only proves it builds.
      - name: Lint and the release bundle
        run: ./gradlew :app:lintRelease :app:bundleRelease --continue

      - name: Upload the lint report and the mapping
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          retention-days: 7
          path: |
            app/build/reports/lint-results-*.html
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
