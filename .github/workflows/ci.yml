# Every push and every pull request builds Chatter the way a release would, minus the signing: if
# this is green, the branch compiles, its tests pass, lint is happy and the changelog entries it
# adds are well formed — which is what the release workflow relies on.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the run before it pointless, so it is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the pending changelog entries
        run: ./gradlew checkChangelog

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The release variant, because that is the one that ships: it lints the minified build's
      # configuration too, and catches a manifest or resource problem a debug build never sees.
      - name: Lint
        run: ./gradlew :app:lintRelease

      # No Twitch Client ID here: CI only proves the app builds, and the login is not exercised.
      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      # The release build is the one that can break on its own: R8 strips and rewrites, the
      # resource shrinker removes what nothing appears to reference, and the bundle is what Play
      # is handed. None of that is exercised by a debug build, and finding out during a release is
      # finding out too late. It signs with the debug key here, which is all CI needs.
      - name: Assemble the release bundle
        run: ./gradlew :app:bundleRelease

      # A spare copy of the APK, and nothing more. The gate is the build, the tests and lint above
      # it, so a full artifact store - which is an account-wide quota, not this repository's doing -
      # is no reason to call the branch broken. The release workflow made the same call.
      - name: Upload the debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: chatter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # The reports say what failed, which the log alone often does not.
      - name: Upload the test and lint reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reports
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/mapping/release/
          if-no-files-found: ignore
