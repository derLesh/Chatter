# Chatter reads emotes, badges and history from services nobody here runs, and any of them can go
# away without saying so — twice already one had, and the app went on quietly showing less than it
# promised. This asks them all once a day, so it shows up here rather than weeks later in a chat.
#
# It is deliberately not part of CI: a provider having a bad minute must not turn a pull request
# red. What goes red here is the provider, not the branch.
name: Endpoints

on:
  schedule:
    # Every morning. GitHub turns scheduled runs off in a repository that has been quiet for sixty
    # days, so after a long break check that this is still running.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Are they still there
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Ask everything Chatter depends on
        run: .github/scripts/check-endpoints.sh
