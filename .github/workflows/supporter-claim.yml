# Fills in the Twitch account of a sponsor. Chatter opens the issue with the Twitch id in it. GitHub
# vouches for the author, docs/supporters.json says whether that account sponsors, and the id only
# goes into that account's entry. Non-sponsors change nothing and are told so.
#
# Issue content never reaches a shell; the body is passed to the script as an environment variable.
name: Supporter badge

# Off until GitHub Sponsors is set up. Re-enable the two lines then.
on:
  # issues:
  #   types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: supporter-claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claim:
    if: contains(github.event.issue.labels.*.name, 'supporter')
    name: Put the Twitch account on the sponsorship
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the issue
        id: claim
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          CLAIM_COMMENT: claim-comment.md
        run: python3 .github/scripts/claim-supporter.py

      - name: Write it down
        if: steps.claim.outputs.claimed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/supporters.json
          git commit -m "Give ${{ github.event.issue.user.login }} their supporter badge"
          git push

      - name: Say what happened
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file claim-comment.md

      - name: Close it, if there is nothing left to do
        if: steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}"
