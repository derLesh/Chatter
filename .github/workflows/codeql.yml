# Code scanning with CodeQL, in place of GitHub's default setup. That one built every variant with
# `assemble`, R8 and ART profiles included, for 15 minutes a push, and cached 2.4 GB per commit,
# which pushed CI's caches out of the repository's 10 GB.
#
# This compiles only the code CodeQL reads: debug and release, so both the dev login and what
# ships are scanned. Default setup must be off (Settings → Code security), or uploads are refused.
name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore: &unscanned
      - '**/*.md'
      - 'docs/**'
      - 'pending-changelog/**'
      - 'version.properties'
  pull_request:
    branches: [master]
    paths-ignore: *unscanned
  # New queries arrive with new CodeQL versions, also when the code has not moved.
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the Gradle wrapper
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The dependencies CI's release build already downloaded; read only, so this job adds nothing
      # to the repository's caches.
      - name: Restore the Gradle home
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-home-release-build-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-home-release-build-

      - name: Set up CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: false

      # CodeQL reads the code as the compiler sees it, so the compile must really run: no build
      # cache, and no Gradle daemon started before CodeQL could watch it.
      - name: Compile
        if: ${{ matrix.build-mode == 'manual' }}
        run: ./gradlew --no-daemon --no-build-cache :app:compileDebugKotlin :app:compileReleaseKotlin

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
