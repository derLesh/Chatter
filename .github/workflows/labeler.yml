name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # The action creates matching labels that do not exist yet.
      issues: write
    steps:
      # pull_request_target allows labeling fork PRs. With no checkout, the action reads its
      # config from the base branch through the API and never runs code from the PR.
      - name: Label changed areas
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
